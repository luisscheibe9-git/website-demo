<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLED Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #000000;
      --panel-border: #141414;
      --text: #e0e0e0;
      --muted: #555555;
      --dim: #262626;
      --accent: #ffffff;
      --accent-green: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 36px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 660px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .brand {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .account-meta {
      font-size: 0.72rem;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
    }

    .sync-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
      display: inline-block;
      transition: background 0.2s ease;
    }

    .sync-dot.synced {
      background: #22c55e;
    }

    .sync-dot.saving {
      background: #eab308;
    }

    .uid-tag {
      color: var(--muted);
      cursor: pointer;
      border-bottom: 1px dotted var(--dim);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-tabs {
      display: flex;
      gap: 20px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 4px 0;
      text-transform: lowercase;
      letter-spacing: 0.05em;
      transition: color 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom: 1px solid var(--accent);
    }

    .view-panel {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .view-panel.active {
      display: flex;
    }

    .input-row {
      display: flex;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 8px;
    }

    .minimal-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      width: 100%;
    }

    .minimal-input::placeholder {
      color: var(--dim);
    }

    /* Items and Lists */
    .item-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .item-label {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      flex: 1;
      word-break: break-word;
    }

    .checkbox {
      appearance: none;
      width: 14px;
      height: 14px;
      border: 1px solid var(--muted);
      background: transparent;
      cursor: pointer;
      display: grid;
      place-content: center;
      border-radius: 0;
      flex-shrink: 0;
    }

    .checkbox:checked {
      background: var(--muted);
      border-color: var(--muted);
    }

    .checkbox:checked::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--bg);
    }

    .item-text {
      color: var(--text);
      transition: color 0.15s ease;
    }

    .checkbox:checked ~ .item-text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--dim);
      font-family: inherit;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 2px 6px;
      transition: color 0.15s ease;
    }

    .action-btn:hover {
      color: var(--text);
    }

    .cal-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .cal-nav {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      padding: 2px 6px;
    }

    .cal-nav:hover {
      color: var(--accent);
    }

    .cal-matrix {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 0.8rem;
    }

    .matrix-head {
      color: var(--dim);
      padding: 6px 0;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .matrix-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--panel-border);
      cursor: pointer;
      color: var(--muted);
      position: relative;
    }

    .matrix-cell:hover {
      border-color: var(--muted);
    }

    .matrix-cell.active-day {
      border-color: var(--accent);
      color: var(--accent);
    }

    .matrix-cell.is-today {
      color: var(--text);
    }

    .matrix-cell.empty {
      border: none;
      cursor: default;
    }

    .event-indicator {
      width: 3px;
      height: 3px;
      background: var(--muted);
      position: absolute;
      bottom: 4px;
    }

    .matrix-cell.active-day .event-indicator {
      background: var(--accent);
    }

    .cal-schedule {
      border-top: 1px solid var(--panel-border);
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .cal-label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .note-sheet {
      width: 100%;
      height: 440px;
      background: transparent;
      border: 1px solid var(--panel-border);
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.6;
      padding: 16px;
      resize: vertical;
    }

    .note-sheet:focus {
      border-color: var(--muted);
    }

    .note-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--dim);
    }

    .notification-banner {
      display: none;
      font-size: 0.75rem;
      color: #94a3b8;
      border: 1px solid var(--panel-border);
      padding: 8px 12px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div class="brand">sys // workspace</div>
        <div class="account-meta">
          <span class="sync-pill">
            <span id="sync-indicator" class="sync-dot"></span>
            <span id="sync-status">connecting</span>
          </span>
          <span>|</span>
          <span id="account-id-label" class="uid-tag" title="Click to copy full user ID">account: connecting...</span>
        </div>
      </div>
      <nav class="nav-tabs">
        <button class="tab-btn active" onclick="navigate('tasks')">tasks</button>
        <button class="tab-btn" onclick="navigate('calendar')">calendar</button>
        <button class="tab-btn" onclick="navigate('notes')">notes</button>
      </nav>
    </header>

    <div id="status-banner" class="notification-banner"></div>

    <!-- 1. Tasks Panel -->
    <main id="tasks" class="view-panel active">
      <div class="input-row">
        <input type="text" id="task-input" class="minimal-input" placeholder="type a task and press enter..." autocomplete="off">
      </div>
      <ul id="task-list" class="item-list"></ul>
    </main>

    <!-- 2. Calendar Panel -->
    <section id="calendar" class="view-panel">
      <div class="cal-controls">
        <button class="cal-nav" onclick="offsetMonth(-1)">&lt;</button>
        <span id="cal-month-name"></span>
        <button class="cal-nav" onclick="offsetMonth(1)">&gt;</button>
      </div>
      <div class="cal-matrix" id="cal-matrix"></div>
      
      <div class="cal-schedule">
        <div class="cal-label" id="cal-schedule-date">select a day</div>
        <div class="input-row">
          <input type="text" id="event-input" class="minimal-input" placeholder="add note/event for selected date..." autocomplete="off">
        </div>
        <ul id="event-list" class="item-list"></ul>
      </div>
    </section>

    <!-- 3. Notes Panel -->
    <section id="notes" class="view-panel">
      <textarea id="note-text" class="note-sheet" placeholder="ink scratchpad..."></textarea>
      <div class="note-footer">
        <span id="note-count">0 words</span>
        <span id="note-state">in-sync</span>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    /* Global in-memory workspace state */
    window.tasks = [];
    window.calendarEvents = {};
    window.notesContent = "";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'oled-workspace';
    let db = null;
    let auth = null;
    let userDocRef = null;
    let authUserId = null;
    let debounceSaveTimer = null;
    let isRemoteUpdate = false;

    const syncIndicator = document.getElementById('sync-indicator');
    const syncStatus = document.getElementById('sync-status');
    const accountIdLabel = document.getElementById('account-id-label');
    const noteText = document.getElementById('note-text');
    const noteCount = document.getElementById('note-count');
    const noteState = document.getElementById('note-state');

    function updateSyncBadge(state, label) {
      syncStatus.innerText = label;
      syncIndicator.className = 'sync-dot ' + (state === 'saved' ? 'synced' : (state === 'saving' ? 'saving' : ''));
    }

    async function setupStorage() {
      if (typeof __firebase_config === 'undefined') {
        syncStatus.innerText = 'offline session';
        accountIdLabel.innerText = 'guest session';
        return;
      }

      try {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        // Authenticate with custom token if provided, otherwise anonymous
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        const user = auth.currentUser;
        if (!user) {
          syncStatus.innerText = 'auth failed';
          return;
        }

        authUserId = user.uid;
        accountIdLabel.innerText = `id: ${authUserId}`;
        accountIdLabel.title = `Full Account ID: ${authUserId} (click to copy)`;
        accountIdLabel.onclick = () => {
          const temp = document.createElement('input');
          temp.value = authUserId;
          document.body.appendChild(temp);
          temp.select();
          document.execCommand('copy');
          document.body.removeChild(temp);
          syncStatus.innerText = 'copied id!';
          setTimeout(() => { syncStatus.innerText = 'synced'; }, 1500);
        };

        // Strict Path: /artifacts/{appId}/users/{userId}/{collectionName}/{documentId}
        userDocRef = doc(db, 'artifacts', appId, 'users', authUserId, 'workspace', 'state');

        // Realtime sync listener with mandatory error callback
        onSnapshot(userDocRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            isRemoteUpdate = true;
            window.tasks = Array.isArray(data.tasks) ? data.tasks : [];
            window.calendarEvents = typeof data.calendarEvents === 'object' && data.calendarEvents !== null ? data.calendarEvents : {};
            window.notesContent = typeof data.notesContent === 'string' ? data.notesContent : "";
            
            if (document.activeElement !== noteText) {
              noteText.value = window.notesContent;
              updateNoteWordCount();
            }

            window.renderTasks();
            window.renderCalendar();
            isRemoteUpdate = false;
            updateSyncBadge('saved', 'synced');
          } else {
            // First time initialization
            triggerPersist(true);
            updateSyncBadge('saved', 'synced');
          }
        }, (error) => {
          console.error("Snapshot error:", error);
          updateSyncBadge('error', 'sync error');
        });

      } catch (err) {
        console.error("Firebase auth/init error:", err);
        updateSyncBadge('error', 'offline mode');
      }
    }

    window.triggerPersist = function(immediate = false) {
      if (!userDocRef || isRemoteUpdate) return;

      updateSyncBadge('saving', 'saving...');
      clearTimeout(debounceSaveTimer);

      const doSave = async () => {
        try {
          await setDoc(userDocRef, {
            tasks: window.tasks,
            calendarEvents: window.calendarEvents,
            notesContent: window.notesContent,
            updatedAt: new Date().toISOString()
          });
          updateSyncBadge('saved', 'synced');
        } catch (err) {
          console.error("Error saving document:", err);
          updateSyncBadge('error', 'save error');
        }
      };

      if (immediate) {
        doSave();
      } else {
        debounceSaveTimer = setTimeout(doSave, 500);
      }
    };

    function updateNoteWordCount() {
      const words = noteText.value.trim() ? noteText.value.trim().split(/\s+/).length : 0;
      noteCount.innerText = `${words} word${words === 1 ? '' : 's'}`;
    }

    // Notes auto-sync listener
    noteText.addEventListener('input', () => {
      window.notesContent = noteText.value;
      noteState.innerText = 'typing...';
      updateNoteWordCount();
      window.triggerPersist(false);
      setTimeout(() => {
        noteState.innerText = 'in-sync';
      }, 500);
    });

    setupStorage();
  </script>

  <script>
    function navigate(viewName) {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.innerText === viewName);
      });
      document.querySelectorAll('.view-panel').forEach(p => {
        p.classList.toggle('active', p.id === viewName);
      });
      if (viewName === 'calendar') renderCalendar();
    }

    // Tasks Management
    const taskInput = document.getElementById('task-input');
    const taskList = document.getElementById('task-list');

    window.renderTasks = function() {
      taskList.innerHTML = '';
      (window.tasks || []).forEach((t, i) => {
        const li = document.createElement('li');
        li.className = 'item-row';
        li.innerHTML = `
          <label class="item-label">
            <input type="checkbox" class="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${i})">
            <span class="item-text">${escapeMarkup(t.text)}</span>
          </label>
          <button class="action-btn" onclick="removeTask(${i})">×</button>
        `;
        taskList.appendChild(li);
      });
    };

    window.toggleTask = function(index) {
      if (!window.tasks[index]) return;
      window.tasks[index].done = !window.tasks[index].done;
      renderTasks();
      window.triggerPersist();
    };

    window.removeTask = function(index) {
      window.tasks.splice(index, 1);
      renderTasks();
      window.triggerPersist();
    };

    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && taskInput.value.trim()) {
        window.tasks.unshift({ text: taskInput.value.trim(), done: false });
        taskInput.value = '';
        renderTasks();
        window.triggerPersist();
      }
    });

    // Calendar Management
    let activeCalDate = new Date();
    let currentSelectedDateKey = dateToKey(new Date());

    const calMatrix = document.getElementById('cal-matrix');
    const calMonthName = document.getElementById('cal-month-name');
    const calScheduleDate = document.getElementById('cal-schedule-date');
    const eventInput = document.getElementById('event-input');
    const eventList = document.getElementById('event-list');

    function dateToKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function offsetMonth(offset) {
      activeCalDate.setMonth(activeCalDate.getMonth() + offset);
      renderCalendar();
    }

    window.renderCalendar = function() {
      calMatrix.innerHTML = '';
      const year = activeCalDate.getFullYear();
      const month = activeCalDate.getMonth();

      const months = ['january', 'february', 'march', 'april', 'may', 'june', 
                      'july', 'august', 'september', 'october', 'november', 'december'];
      calMonthName.innerText = `${months[month]} ${year}`;

      const weekdayNames = ['su', 'mo', 'tu', 'we', 'th', 'fr', 'sa'];
      weekdayNames.forEach(name => {
        const col = document.createElement('div');
        col.className = 'matrix-head';
        col.innerText = name;
        calMatrix.appendChild(col);
      });

      const firstDayDayOfWeek = new Date(year, month, 1).getDay();
      const daysCountInMonth = new Date(year, month + 1, 0).getDate();
      const todayKey = dateToKey(new Date());

      for (let i = 0; i < firstDayDayOfWeek; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'matrix-cell empty';
        calMatrix.appendChild(emptyCell);
      }

      const eventsMap = window.calendarEvents || {};

      for (let day = 1; day <= daysCountInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'matrix-cell';
        const dayKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

        if (dayKey === todayKey) cell.classList.add('is-today');
        if (dayKey === currentSelectedDateKey) cell.classList.add('active-day');

        cell.innerText = day;

        if (eventsMap[dayKey] && eventsMap[dayKey].length > 0) {
          const marker = document.createElement('div');
          marker.className = 'event-indicator';
          cell.appendChild(marker);
        }

        cell.onclick = () => {
          currentSelectedDateKey = dayKey;
          renderCalendar();
          renderSchedule();
        };

        calMatrix.appendChild(cell);
      }
      renderSchedule();
    };

    function renderSchedule() {
      calScheduleDate.innerText = currentSelectedDateKey ? `entries :: ${currentSelectedDateKey}` : 'select a day';
      eventList.innerHTML = '';
      const eventsMap = window.calendarEvents || {};
      const entries = eventsMap[currentSelectedDateKey] || [];
      entries.forEach((entry, idx) => {
        const li = document.createElement('li');
        li.className = 'item-row';
        li.innerHTML = `
          <span class="item-text">${escapeMarkup(entry)}</span>
          <button class="action-btn" onclick="removeEvent('${currentSelectedDateKey}', ${idx})">×</button>
        `;
        eventList.appendChild(li);
      });
    }

    window.removeEvent = function(key, idx) {
      if (window.calendarEvents && window.calendarEvents[key]) {
        window.calendarEvents[key].splice(idx, 1);
        if (window.calendarEvents[key].length === 0) delete window.calendarEvents[key];
        renderCalendar();
        window.triggerPersist();
      }
    };

    eventInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && eventInput.value.trim()) {
        if (!currentSelectedDateKey) return;
        if (!window.calendarEvents) window.calendarEvents = {};
        if (!window.calendarEvents[currentSelectedDateKey]) {
          window.calendarEvents[currentSelectedDateKey] = [];
        }
        window.calendarEvents[currentSelectedDateKey].push(eventInput.value.trim());
        eventInput.value = '';
        renderCalendar();
        window.triggerPersist();
      }
    });

    function escapeMarkup(str) {
      const el = document.createElement('div');
      el.innerText = str;
      return el.innerHTML;
    }

    // Initial first-paint render
    renderTasks();
  </script>
</body>
</html>
